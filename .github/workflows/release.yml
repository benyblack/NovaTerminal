name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to publish (for example v0.1.1)"
        required: true
        type: string
      target_commitish:
        description: "Branch, tag, or commit to build when dispatching manually"
        required: false
        default: "main"
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CONFIGURATION: Release
  # Same daemon hygiene as ci.yml / scripts/build.* — see CLAUDE.md: without these,
  # MSBuild worker nodes and the build server outlive the step and hang the runner
  # when stdout is captured.
  DOTNET_CLI_USE_MSBUILD_SERVER: 0
  MSBUILDDISABLENODEREUSE: 1

jobs:
  release_metadata:
    name: Resolve Release Metadata
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
      release_version: ${{ steps.meta.outputs.release_version }}
      checkout_ref: ${{ steps.meta.outputs.checkout_ref }}
    steps:
      - name: Resolve tag and checkout ref
        id: meta
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            tag="${{ github.ref_name }}"
            echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
            echo "checkout_ref=${{ github.ref }}" >> "$GITHUB_OUTPUT"
          else
            tag="${{ inputs.tag_name }}"
            echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
            echo "checkout_ref=${{ inputs.target_commitish }}" >> "$GITHUB_OUTPUT"
          fi
          # Velopack versions are SemVer without a leading 'v'; the tag has one.
          echo "release_version=${tag#v}" >> "$GITHUB_OUTPUT"

  create_release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [release_metadata]
    steps:
      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release_metadata.outputs.release_tag }}
          generate_release_notes: true
          # A SemVer tag's only legal use of '-' is the prerelease separator, so
          # contains('-') is a sound test for "v0.5.0-beta.1 is not a stable release".
          #
          # This flag is load-bearing for the update feed, not cosmetic. Velopack's
          # GithubSource(repoUrl, token, prerelease: false) filters on GitHub's own
          # `prerelease` FLAG (GetReleases does `.Where(x => includePrereleases ||
          # !x.Prerelease)`) - it never inspects the SemVer suffix. And
          # UpdateManager.CheckForUpdatesAsync does no prerelease filtering of its own
          # either: it is a bare `feed.Where(Full).MaxBy(x => x.Version)`. So without
          # this line a beta tag publishes as a NORMAL release, 0.5.0-beta.1 sorts above
          # 0.4.0, and every installed stable user gets pulled onto the beta. Same story
          # for `vpk download github`, which filters on the identical flag.
          prerelease: ${{ contains(needs.release_metadata.outputs.release_tag, '-') }}

  build_native:
    name: Build Native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    needs: [release_metadata]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release_metadata.outputs.checkout_ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/NovaTerminal.App/native

      - name: Build Rust (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd src/NovaTerminal.App/native
          cargo build --release
          cd rusty_ssh
          cargo build --release

      - name: Build Rust (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd src/NovaTerminal.App/native
          cargo build --release
          mkdir -p ../native/target_linux/release
          cp target/release/librusty_pty.so ../native/target_linux/release/
          cd rusty_ssh
          cargo build --release

      - name: Build Rust (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          cd src/NovaTerminal.App/native
          cargo build --release
          cd rusty_ssh
          cargo build --release

      - name: Upload Native Artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.os }}
          path: |
            src/NovaTerminal.App/native/target*/**/release/*pty.*
            src/NovaTerminal.App/native/rusty_ssh/target*/**/release/*ssh.*

  # Release gate (#156): releases used to publish AOT bundles without running a
  # single test. Run the same deterministic unit lane that gates PRs in ci.yml —
  # on all three release OSes, which also gives macOS its only automated test
  # coverage — before any bundle is published.
  release_tests:
    name: Release Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: [release_metadata, build_native]
    strategy:
      fail-fast: true
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release_metadata.outputs.checkout_ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Download Native Artifact
        uses: actions/download-artifact@v4
        with:
          name: native-${{ matrix.os }}
          path: src/NovaTerminal.App/native

      - name: Restore
        run: dotnet restore

      - name: Build
        env:
          SKIP_RUST_NATIVE_BUILD: "1"
        run: dotnet build -c ${{ env.CONFIGURATION }} --no-restore

      # Mirrors the gating unit lane in ci.yml (same projects, same filter).
      - name: Test (unit — gating, non-headless projects)
        env:
          SKIP_RUST_NATIVE_BUILD: "1"
        shell: bash
        run: |
          set -e
          filter="Category!=Replay&Category!=RenderMetrics&Category!=PtySmoke&Category!=Stress&Category!=GoldenSharedPng"
          for proj in VT Rendering Architecture Platform McpServer; do
            echo "::group::NovaTerminal.$proj.Tests"
            dotnet test "tests/NovaTerminal.$proj.Tests" -c "$CONFIGURATION" --no-build --no-restore \
              --filter "$filter" --logger "trx;LogFileName=release_${proj}.trx"
            echo "::endgroup::"
          done

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-tests-${{ matrix.os }}
          retention-days: 5
          path: "**/*.trx"

  publish_aot:
    name: Publish AOT (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    needs: [release_metadata, create_release, build_native, release_tests]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release_metadata.outputs.checkout_ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Download Native Artifact
        uses: actions/download-artifact@v4
        with:
          name: native-${{ matrix.os }}
          path: src/NovaTerminal.App/native

      - name: Restore
        run: dotnet restore

      - name: Publish AOT
        env:
          SKIP_RUST_NATIVE_BUILD: "1"
        run: dotnet publish src/NovaTerminal.App/NovaTerminal.App.csproj -c ${{ env.CONFIGURATION }} -r ${{ matrix.rid }} --self-contained true -p:PublishAot=true -p:SkipCliShim=true -p:Version=${{ needs.release_metadata.outputs.release_version }} -p:InformationalVersion=${{ needs.release_metadata.outputs.release_version }} -o artifacts/publish/${{ matrix.rid }}

      - name: Archive bundle
        shell: pwsh
        run: |
          $rid = "${{ matrix.rid }}"
          $source = "artifacts/publish/$rid"
          $dest = "artifacts/release/NovaTerminal-$rid-${{ needs.release_metadata.outputs.release_tag }}.zip"
          New-Item -ItemType Directory -Force -Path "artifacts/release" | Out-Null
          if (Test-Path $dest) { Remove-Item $dest -Force }
          Compress-Archive -Path "$source/*" -DestinationPath $dest

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release_metadata.outputs.release_tag }}
          files: artifacts/release/NovaTerminal-${{ matrix.rid }}-${{ needs.release_metadata.outputs.release_tag }}.zip

      # ---- Windows installer + update feed (#91). win-x64 only; the other two RIDs
      # ---- keep shipping portable zips exactly as before.
      - name: Install vpk
        if: matrix.rid == 'win-x64'
        run: dotnet tool install -g vpk --version 1.2.0

      - name: Download previous Velopack release (for delta generation)
        if: matrix.rid == 'win-x64'
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/velopack | Out-Null
          # First release ever, or no prior Velopack assets: nothing to download, and a
          # full-only release is the correct outcome rather than a failed one.
          vpk download github --repoUrl https://github.com/benyblack/NovaTerminal --token $env:GH_TOKEN --outputDir artifacts/velopack

      - name: Pack Windows installer (Velopack)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $ver = "${{ needs.release_metadata.outputs.release_version }}"
          $tag = "${{ needs.release_metadata.outputs.release_tag }}"

          # Record whether the download step actually brought back a PREVIOUS-version full
          # package, before anything below mutates the directory. This is the only moment the
          # answer is knowable: the cleanup immediately after removes this version's own
          # nupkgs, and `vpk pack` then adds more.
          $priorFulls = @(Get-ChildItem artifacts/velopack -Filter "NovaTerminal-*-full.nupkg" -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -ne "NovaTerminal-$ver-full.nupkg" })
          $expectDelta = $priorFulls.Count -gt 0
          if ($expectDelta) {
            Write-Host "Prior full package(s) present, so a delta is expected: $($priorFulls.Name -join ', ')"
          } else {
            Write-Host "No prior full package present; full-only output is the correct result."
          }

          # Make a re-run idempotent. `vpk download github` picks the max-version full out of
          # the union feed; for an already-published tag that is the tag's OWN
          # NovaTerminal-$ver-full.nupkg, and `vpk pack` then hard-fails with
          # "[FTL] There is a release in channel win which is equal or greater to the current
          # version $ver". Because the portable zips upload in an earlier step, that leaves a
          # half-published release behind a red job. This workflow supports workflow_dispatch
          # re-runs by design, so dropping this version's own artifacts first is required, not
          # defensive.
          Get-ChildItem artifacts/velopack -Filter "NovaTerminal-$ver-*.nupkg" -ErrorAction SilentlyContinue | Remove-Item -Force

          vpk pack `
            --packId NovaTerminal `
            --packVersion $ver `
            --packDir artifacts/publish/win-x64 `
            --mainExe NovaTerminal.exe `
            --packTitle NovaTerminal `
            --packAuthors benyblack `
            --icon src/NovaTerminal.App/Assets/nova_icon.ico `
            --outputDir artifacts/velopack `
            --noPortable
          # --noPortable: the release already ships NovaTerminal-win-x64-<tag>.zip, and two
          # near-identical zips on the releases page is a support question waiting to happen.

          # The installer's file name is ours to choose - nothing resolves it by name - so
          # give it one that reads clearly next to the zips. Matched by glob because vpk
          # includes the channel in the name it produces.
          $setup = Get-ChildItem artifacts/velopack -Filter "*Setup.exe" | Select-Object -First 1
          if (-not $setup) { throw "vpk pack produced no Setup.exe" }
          Move-Item $setup.FullName "artifacts/velopack/NovaTerminal-Setup-win-x64-$tag.exe"

          Write-Host "Velopack output:"
          Get-ChildItem artifacts/velopack | Select-Object Name, Length | Format-Table

          # Assert here rather than at the upload step. The download step is
          # continue-on-error (correct - the first release has no prior to fetch) and the
          # upload leaves fail_on_unmatched_files at its permissive default (also required -
          # the first release legitimately produces no delta). Together those two mean a
          # FAILED download would otherwise publish a permanent full-only release with a green
          # job and no signal anywhere. Flipping fail_on_unmatched_files would break the
          # legitimate first release instead, so the signal belongs here.
          if (-not (Test-Path "artifacts/velopack/NovaTerminal-$ver-full.nupkg")) {
            throw "vpk pack produced no NovaTerminal-$ver-full.nupkg - the update feed would be unusable."
          }
          if ($expectDelta -and -not (Test-Path "artifacts/velopack/NovaTerminal-$ver-delta.nupkg")) {
            throw "A prior full package was present but vpk pack produced no NovaTerminal-$ver-delta.nupkg - delta generation silently failed."
          }

      # Known and benign: the uploaded releases.win.json lists the PREVIOUS release's full
      # nupkg too, which is not an asset on THIS release. `vpk pack` re-indexes the whole
      # output directory, and the previous full is in there because the download step put it
      # there for delta generation. Deleting it before packing would not help - by the time
      # the feed exists the entry is already inside it.
      #
      # Harmless because nothing on the happy path ever selects that entry:
      # CheckForUpdatesAsync takes the MAX version, so only a downgrade would reach a
      # non-latest full, and AllowVersionDowngrade is off. If something did select it,
      # GitBase.DownloadReleaseEntry resolves assets by name within the release the feed came
      # from and would throw "Could not find asset called '...' in GitHub Release '<tag>'" -
      # and that same asset resolves fine through its own release's feed, which is what
      # clients on the previous version are actually reading.
      #
      # The version-scoped globs below are what keep stale nupkgs from being re-UPLOADED onto
      # this release; do not broaden them to `NovaTerminal-*.nupkg`.
      - name: Upload Windows installer and update feed
        if: matrix.rid == 'win-x64'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release_metadata.outputs.release_tag }}
          files: |
            artifacts/velopack/NovaTerminal-Setup-win-x64-${{ needs.release_metadata.outputs.release_tag }}.exe
            artifacts/velopack/NovaTerminal-${{ needs.release_metadata.outputs.release_version }}-full.nupkg
            artifacts/velopack/NovaTerminal-${{ needs.release_metadata.outputs.release_version }}-delta.nupkg
            artifacts/velopack/releases.win.json

  # Opens a submission PR to microsoft/winget-pkgs for the just-published Windows
  # zip (portable package; see packaging/winget/). Optional and self-skipping:
  # runs only on real tag pushes and only when the WINGET_PAT secret is set.
  #
  # wingetcreate re-downloads the asset, recomputes the SHA256, and updates the
  # latest manifest from winget-pkgs — so it requires benyblack.NovaTerminal to
  # ALREADY exist there. Bootstrap the first version manually (see
  # packaging/winget/README.md); subsequent releases flow through this job.
  submit_winget:
    name: Submit to winget-pkgs
    runs-on: windows-latest
    needs: [release_metadata, publish_aot]
    if: github.event_name == 'push'
    steps:
      - name: Submit manifest via wingetcreate
        shell: pwsh
        env:
          WINGET_PAT: ${{ secrets.WINGET_PAT }}
        run: |
          if (-not $env:WINGET_PAT) {
            Write-Host "WINGET_PAT not set; skipping winget-pkgs submission."
            exit 0
          }
          $tag = "${{ needs.release_metadata.outputs.release_tag }}"
          $ver = $tag.TrimStart('v')
          $url = "https://github.com/benyblack/NovaTerminal/releases/download/$tag/NovaTerminal-win-x64-$tag.zip"
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          ./wingetcreate.exe update benyblack.NovaTerminal --version $ver --urls "$url" --submit --token $env:WINGET_PAT
