name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to publish (for example v0.1.1)"
        required: true
        type: string
      target_commitish:
        description: "Branch, tag, or commit to build when dispatching manually"
        required: false
        default: "main"
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CONFIGURATION: Release
  # Same daemon hygiene as ci.yml / scripts/build.* — see CLAUDE.md: without these,
  # MSBuild worker nodes and the build server outlive the step and hang the runner
  # when stdout is captured.
  DOTNET_CLI_USE_MSBUILD_SERVER: 0
  MSBUILDDISABLENODEREUSE: 1

jobs:
  release_metadata:
    name: Resolve Release Metadata
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
      checkout_ref: ${{ steps.meta.outputs.checkout_ref }}
    steps:
      - name: Resolve tag and checkout ref
        id: meta
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "release_tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "checkout_ref=${{ github.ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "release_tag=${{ inputs.tag_name }}" >> "$GITHUB_OUTPUT"
            echo "checkout_ref=${{ inputs.target_commitish }}" >> "$GITHUB_OUTPUT"
          fi

  create_release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [release_metadata]
    steps:
      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release_metadata.outputs.release_tag }}
          generate_release_notes: true

  build_native:
    name: Build Native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    needs: [release_metadata]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release_metadata.outputs.checkout_ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/NovaTerminal.App/native

      - name: Build Rust (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd src/NovaTerminal.App/native
          cargo build --release
          cd rusty_ssh
          cargo build --release

      - name: Build Rust (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd src/NovaTerminal.App/native
          cargo build --release
          mkdir -p ../native/target_linux/release
          cp target/release/librusty_pty.so ../native/target_linux/release/
          cd rusty_ssh
          cargo build --release

      - name: Build Rust (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          cd src/NovaTerminal.App/native
          cargo build --release
          cd rusty_ssh
          cargo build --release

      - name: Upload Native Artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.os }}
          path: |
            src/NovaTerminal.App/native/target*/**/release/*pty.*
            src/NovaTerminal.App/native/rusty_ssh/target*/**/release/*ssh.*

  # Release gate (#156): releases used to publish AOT bundles without running a
  # single test. Run the same deterministic unit lane that gates PRs in ci.yml —
  # on all three release OSes, which also gives macOS its only automated test
  # coverage — before any bundle is published.
  release_tests:
    name: Release Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: [release_metadata, build_native]
    strategy:
      fail-fast: true
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release_metadata.outputs.checkout_ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Download Native Artifact
        uses: actions/download-artifact@v4
        with:
          name: native-${{ matrix.os }}
          path: src/NovaTerminal.App/native

      - name: Restore
        run: dotnet restore

      - name: Build
        env:
          SKIP_RUST_NATIVE_BUILD: "1"
        run: dotnet build -c ${{ env.CONFIGURATION }} --no-restore

      # Mirrors the gating unit lane in ci.yml (same projects, same filter).
      - name: Test (unit — gating, non-headless projects)
        env:
          SKIP_RUST_NATIVE_BUILD: "1"
        shell: bash
        run: |
          set -e
          filter="Category!=Replay&Category!=RenderMetrics&Category!=PtySmoke&Category!=Stress&Category!=GoldenSharedPng"
          for proj in VT Rendering Architecture Platform McpServer; do
            echo "::group::NovaTerminal.$proj.Tests"
            dotnet test "tests/NovaTerminal.$proj.Tests" -c "$CONFIGURATION" --no-build --no-restore \
              --filter "$filter" --logger "trx;LogFileName=release_${proj}.trx"
            echo "::endgroup::"
          done

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-tests-${{ matrix.os }}
          retention-days: 5
          path: "**/*.trx"

  publish_aot:
    name: Publish AOT (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    needs: [release_metadata, create_release, build_native, release_tests]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release_metadata.outputs.checkout_ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Download Native Artifact
        uses: actions/download-artifact@v4
        with:
          name: native-${{ matrix.os }}
          path: src/NovaTerminal.App/native

      - name: Restore
        run: dotnet restore

      - name: Publish AOT
        env:
          SKIP_RUST_NATIVE_BUILD: "1"
        run: dotnet publish src/NovaTerminal.App/NovaTerminal.App.csproj -c ${{ env.CONFIGURATION }} -r ${{ matrix.rid }} --self-contained true -p:PublishAot=true -p:SkipCliShim=true -o artifacts/publish/${{ matrix.rid }}

      - name: Archive bundle
        shell: pwsh
        run: |
          $rid = "${{ matrix.rid }}"
          $source = "artifacts/publish/$rid"
          $dest = "artifacts/release/NovaTerminal-$rid-${{ needs.release_metadata.outputs.release_tag }}.zip"
          New-Item -ItemType Directory -Force -Path "artifacts/release" | Out-Null
          if (Test-Path $dest) { Remove-Item $dest -Force }
          Compress-Archive -Path "$source/*" -DestinationPath $dest

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release_metadata.outputs.release_tag }}
          files: artifacts/release/NovaTerminal-${{ matrix.rid }}-${{ needs.release_metadata.outputs.release_tag }}.zip

      # Velopack installer + auto-update, win-x64 only (#91). These steps supplement the
      # portable zip above -- they never replace it. Both end up on the same release.
      #
      # The vpk version is pinned and must stay in lockstep with the Velopack PackageVersion in
      # Directory.Packages.props: the library and the tool agree an on-disk release format, and a
      # mismatch produces packages the installed app cannot read.
      - name: Install Velopack CLI (vpk)
        if: matrix.rid == 'win-x64'
        run: dotnet tool install -g vpk --version 1.2.0

      # Fetches the previous release's Velopack assets so pack can compute a delta against them.
      # Tolerated failure: the first Velopack release has no predecessor, and a delta is an
      # optimisation -- a full package still installs and still updates.
      - name: Download prior Velopack release (for deltas)
        if: matrix.rid == 'win-x64'
        continue-on-error: true
        run: >
          vpk download github
          --repoUrl https://github.com/benyblack/NovaTerminal
          --outputDir artifacts/velopack
          --token ${{ secrets.GITHUB_TOKEN }}

      # packId MUST NOT be "NovaTerminal". Velopack installs to %LocalAppData%\<packId> and
      # clears that directory on install -- and AppPaths.RootDirectory is
      # %LocalAppData%\NovaTerminal, the app's settings/themes/workspaces/ssh store. Packing as
      # "NovaTerminal" therefore aims the installer at the user's own config and deletes it.
      # This is not hypothetical: it destroyed config on two machines during the spike.
      # --packTitle carries the display name, so the shortcut and ARP entry still read
      # "NovaTerminal". VelopackPackIdTests enforces this; do not "simplify" it back.
      - name: Velopack pack
        if: matrix.rid == 'win-x64'
        shell: pwsh
        env:
          # Read through the environment, never interpolated into the script body: a template
          # containing a quote would otherwise break parsing, and one containing a semicolon
          # would run as a second command.
          VPK_SIGN_TEMPLATE: ${{ secrets.VPK_SIGN_TEMPLATE }}
        run: |
          $version = "${{ needs.release_metadata.outputs.release_tag }}".TrimStart('v')

          # Signing seam. Absent secret => empty array => vpk packs unsigned and succeeds.
          # See docs/packaging/windows-signing.md.
          $signArgs = @()
          if (-not [string]::IsNullOrWhiteSpace($env:VPK_SIGN_TEMPLATE)) {
            $signArgs = @('--signTemplate', $env:VPK_SIGN_TEMPLATE)
          }

          vpk pack `
            --packId NovaTerminalApp `
            --packTitle NovaTerminal `
            --packVersion $version `
            --packDir artifacts/publish/win-x64 `
            --mainExe NovaTerminal.exe `
            --icon src/NovaTerminal.App/Assets/nova_icon.ico `
            --outputDir artifacts/velopack `
            @signArgs

      # --outputDir must match the pack step: it defaults to "Releases", so omitting it here
      # would upload nothing. --merge is required because the release already exists by this
      # point -- create_release made it and the portable zips are already attached.
      - name: Publish Velopack assets to the GitHub release
        if: matrix.rid == 'win-x64'
        run: >
          vpk upload github
          --repoUrl https://github.com/benyblack/NovaTerminal
          --outputDir artifacts/velopack
          --token ${{ secrets.GITHUB_TOKEN }}
          --tag ${{ needs.release_metadata.outputs.release_tag }}
          --releaseName ${{ needs.release_metadata.outputs.release_tag }}
          --merge
          --publish

  # Opens a submission PR to microsoft/winget-pkgs for the just-published Windows
  # zip (portable package; see packaging/winget/). Optional and self-skipping:
  # runs only on real tag pushes and only when the WINGET_PAT secret is set.
  #
  # wingetcreate re-downloads the asset, recomputes the SHA256, and updates the
  # latest manifest from winget-pkgs — so it requires benyblack.NovaTerminal to
  # ALREADY exist there. Bootstrap the first version manually (see
  # packaging/winget/README.md); subsequent releases flow through this job.
  submit_winget:
    name: Submit to winget-pkgs
    runs-on: windows-latest
    needs: [release_metadata, publish_aot]
    if: github.event_name == 'push'
    steps:
      - name: Submit manifest via wingetcreate
        shell: pwsh
        env:
          WINGET_PAT: ${{ secrets.WINGET_PAT }}
        run: |
          if (-not $env:WINGET_PAT) {
            Write-Host "WINGET_PAT not set; skipping winget-pkgs submission."
            exit 0
          }
          $tag = "${{ needs.release_metadata.outputs.release_tag }}"
          $ver = $tag.TrimStart('v')
          $url = "https://github.com/benyblack/NovaTerminal/releases/download/$tag/NovaTerminal-win-x64-$tag.zip"
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          ./wingetcreate.exe update benyblack.NovaTerminal --version $ver --urls "$url" --submit --token $env:WINGET_PAT
