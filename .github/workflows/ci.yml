  aot_publish:
    name: AOT Publish (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'workflow_dispatch'
    # 90 rather than 40: the signed mac lane waits synchronously on Apple's
    # notarization queue inside vpk pack, which alone can run 10-30+ minutes on a
    # slow day — 40 was cutting the job down mid-wait.
    timeout-minutes: 90
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64

    # The secrets context is not allowed in step-level `if` (the workflow fails to
    # parse), so the signing gate is materialized here as an env boolean the macOS
    # keychain step can test. Mirrors release.yml's publish_aot.
    env:
      MAC_SIGNING_ENABLED: ${{ secrets.MAC_CERT_P12_BASE64 != '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Cache .NET SDK
        uses: actions/cache@v4
        with:
          path: ~/.dotnet
          key: dotnet-sdk-${{ runner.os }}-${{ hashFiles('global.json') }}
          restore-keys: dotnet-sdk-${{ runner.os }}-

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        env:
          DOTNET_INSTALL_DIR: ~/.dotnet
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dotnet-build-${{ matrix.os }}
          path: tests

      - name: Restore
        run: dotnet restore

      # -p:SkipCliShim=true matches release.yml's Publish AOT step, and is required rather than
      # tidy. BuildCliShim invokes NovaTerminal.Cli out of band with -p:BuildProjectReferences=false
      # (that is what breaks the cycle - this project's build is what places the CLI beside it), and
      # the nested invocation carries no RuntimeIdentifier, so it looks for this project's reference
      # assembly at the RID-less obj/Release/net10.0/ref/. A self-contained RID publish writes its
      # intermediates under a win-x64/linux-x64/osx-arm64 subdirectory, so on a clean checkout that
      # path never exists and the nested build dies on a bare CS0006 naming it. Passing the RID down
      # does not help: the CLI references this project as an executable and then wants its apphost,
      # which a self-contained build never writes to obj. The shim is a framework-dependent artifact
      # and would be the wrong thing to embed here anyway - the AOT binary dispatches the CLI modes
      # itself (see Program.cs), which is why released bundles skip it too.
      - name: Publish AOT
        run: dotnet publish src/NovaTerminal.App/NovaTerminal.App.csproj -c ${{ env.CONFIGURATION }} -r ${{ matrix.rid }} --self-contained true -p:PublishAot=true -p:SkipCliShim=true -o artifacts/publish/${{ matrix.rid }}

      # ---- macOS packaging dry run (osx-arm64 only): the same vpk pack invocation
      # ---- release.yml runs, minus the download/upload-release steps. None of this is
      # ---- runnable from a Windows or Linux dev box, so this dispatch lane is the only
      # ---- way to verify the NovaTerminal.app bundle, the .pkg installer and the osx
      # ---- feed asset names BEFORE a real tag ships them. The vpk version is pinned to
      # ---- the same 1.2.0 as release.yml and Directory.Packages.props — the three must
      # ---- stay in lockstep.
      - name: Install vpk
        if: matrix.rid == 'osx-arm64'
        run: dotnet tool install -g vpk --version 1.2.0

      - name: Generate macOS app icon (.icns)
        if: matrix.rid == 'osx-arm64'
        run: packaging/macos/make-icns.sh src/NovaTerminal.App/Assets/nova_icon.png artifacts/icon/nova_icon.icns

      # Same secret-gated signing setup as release.yml's osx-arm64 lane (same action,
      # same gate), so this dispatch lane is also the pre-tag validation of the whole
      # codesign/notarize/staple path — not just of the unsigned packaging. When
      # MAC_CERT_P12_BASE64 is unset the step (and the flags below) is skipped and the
      # dry run packs unsigned, as it always did. See packaging/macos/README.md.
      - name: Set up macOS signing keychain
        id: mac_signing
        if: matrix.rid == 'osx-arm64' && env.MAC_SIGNING_ENABLED == 'true'
        uses: ./.github/actions/setup-mac-signing
        with:
          cert-p12-base64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          installer-p12-base64: ${{ secrets.MAC_INSTALLER_CERT_P12_BASE64 }}
          cert-password: ${{ secrets.MAC_CERT_PASSWORD }}
          sign-app-identity: ${{ secrets.MAC_SIGN_APP_IDENTITY }}
          sign-install-identity: ${{ secrets.MAC_SIGN_INSTALL_IDENTITY }}
          notary-profile: ${{ secrets.MAC_NOTARY_PROFILE }}
          apple-id: ${{ secrets.MAC_APPLE_ID }}
          team-id: ${{ secrets.MAC_TEAM_ID }}
          app-specific-password: ${{ secrets.MAC_APP_SPECIFIC_PASSWORD }}

      # 0.0.1-ci: a dry-run version that can never collide with a real release's feed
      # (vpk rejects anything below 0.0.1, so 0.0.0-ci is not an option here).
      # Assertions mirror what release.yml asserts post-pack, so a silent vpk change
      # fails HERE rather than at the next tag.
      - name: Pack macOS bundle (Velopack dry run)
        if: matrix.rid == 'osx-arm64'
        shell: bash
        env:
          # Signing reaches the script through env, never interpolated into its source;
          # when the keychain step was skipped these are empty and vpk stays unsigned.
          MAC_SIGNING: ${{ steps.mac_signing.outputs.imported }}
          MAC_SIGN_KEYCHAIN: ${{ steps.mac_signing.outputs.keychain }}
          MAC_SIGN_APP_IDENTITY: ${{ secrets.MAC_SIGN_APP_IDENTITY }}
          MAC_SIGN_INSTALL_IDENTITY: ${{ secrets.MAC_SIGN_INSTALL_IDENTITY }}
          MAC_NOTARY_PROFILE: ${{ secrets.MAC_NOTARY_PROFILE }}
        run: |
          set -euo pipefail
          # StripSymbols=true leaves a ~94 MB NovaTerminal.dSYM beside the binary (3x the
          # binary's own size). Delete it at the source AND exclude it in vpk: deletion
          # keeps empty dSYM directory skeletons out of the bundle entirely, --exclude
          # (vpk's built-in default covers only .pdb) is defense-in-depth. Nothing else
          # consumes the symbols - the raw publish-dir zip this dSYM used to ship in no
          # longer exists for macOS.
          rm -rf artifacts/publish/osx-arm64/NovaTerminal.dSYM
          # Same secret-gated signing flags as release.yml (see its comments there);
          # the +guard keeps an empty array valid under set -u on bash 3.2.
          sign_args=()
          if [[ "${MAC_SIGNING:-}" == "1" ]]; then
            sign_args+=(
              --signAppIdentity "$MAC_SIGN_APP_IDENTITY"
              --signInstallIdentity "$MAC_SIGN_INSTALL_IDENTITY"
              --notaryProfile "$MAC_NOTARY_PROFILE"
              --keychain "$MAC_SIGN_KEYCHAIN"
            )
          fi
          vpk pack \
            --packId NovaTerminalApp \
            --packVersion 0.0.1-ci \
            --packDir artifacts/publish/osx-arm64 \
            --mainExe NovaTerminal \
            --packTitle NovaTerminal \
            --packAuthors benyblack \
            --bundleId com.benyblack.NovaTerminal \
            --icon artifacts/icon/nova_icon.icns \
            --exclude 'NovaTerminal\.dSYM' \
            --outputDir artifacts/velopack-dryrun \
            ${sign_args[@]+"${sign_args[@]}"}

          echo "Velopack dry-run output:"
          ls -l artifacts/velopack-dryrun

          test -n "$(ls artifacts/velopack-dryrun/*-osx-Setup.pkg 2>/dev/null || true)" || { echo "vpk pack produced no -osx-Setup.pkg" >&2; exit 1; }
          test -n "$(ls artifacts/velopack-dryrun/*-osx-Portable.zip 2>/dev/null || true)" || { echo "vpk pack produced no -osx-Portable.zip" >&2; exit 1; }
          test -f artifacts/velopack-dryrun/NovaTerminalApp-0.0.1-ci-osx-full.nupkg || { echo "vpk pack produced no full nupkg" >&2; exit 1; }
          test -f artifacts/velopack-dryrun/releases.osx.json || { echo "vpk pack produced no releases.osx.json" >&2; exit 1; }
          # StripSymbols leaves the dSYM beside the binary; the rm + --exclude above keep
          # it out of the bundle users download. Pin that: no dSYM entry may appear in
          # the Portable zip at all, not even an empty directory skeleton.
          if unzip -l artifacts/velopack-dryrun/NovaTerminalApp-osx-Portable.zip | grep -q "dSYM"; then
            echo "NovaTerminal.dSYM leaked into the Portable bundle" >&2
            exit 1
          fi

      - name: Upload macOS packaging dry-run artifacts
        if: matrix.rid == 'osx-arm64'
        uses: actions/upload-artifact@v4
        with:
          name: macos-packaging-dryrun
          retention-days: 7
          path: artifacts/velopack-dryrun

      - name: Upload AOT bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aot-${{ matrix.rid }}
          retention-days: 7
          path: artifacts/publish/${{ matrix.rid }}

  # Linux packaging: dry run + smoke gate (#91 Linux leg). Two callers of the same
  # scripts release.yml uses, so packaging breaks land on a PR rather than on a tag.
  #
  # ubuntu-22.04, not ubuntu-latest, and that is not incidental: NativeAOT links
  # against the build machine's glibc with no runtime fallback, so the runner choice
  # IS the minimum supported distro. 22.04 sets the floor at glibc 2.35 (Ubuntu
  # 22.04+, Debian 12+, Fedora 36+). Publishing on ubuntu-latest would silently
  # exclude the most-deployed LTS - which is what it was doing before this job.
  #
  # x64 only: this lane exists to catch asset-naming and layout mistakes, which are
  # architecture-independent. release.yml covers arm64.
  #
  # This job is deliberately NOT gated by a workflow-level `paths:` filter - that
  # would gate every other job in this file, and the `pull_request` trigger above
  # only has `paths-ignore`. Instead the job's own `if:` stays event-based (always
  # eligible to run), and the "Detect packaging changes" step below decides whether
  # the expensive part actually runs: workflow_dispatch is always a full dry run,
  # push (to main, per the trigger above - i.e. a post-merge run, not every commit)
  # always runs fully too as a cheap post-merge canary, and pull_request only runs
  # fully when the diff against the PR's merge base touches packaging/linux/** or a
  # workflow file - otherwise the job exits quickly without doing the ~40-minute
  # AOT/build/smoke work.
  linux_packaging:
    name: Linux Packaging (dry run + smoke)
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not the default shallow (depth-1) checkout: the change-
          # detection step below needs `git diff` against the PR's merge base, and
          # for a pull_request event the default checkout is the merge commit with
          # no parents fetched. A shallow checkout would make that diff wrong or
          # empty - silently disabling the PR gate this job exists to provide.
          fetch-depth: 0

      # Dependency-free path filter (no third-party action - this repo uses none
      # for path filtering elsewhere). workflow_dispatch and push always run the
      # full job; pull_request only runs it when the diff against the PR's merge
      # base touches packaging/linux/** or a workflow file.
      - name: Detect packaging changes
        id: detect
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "${{ github.event_name }}: always runs the full job."
            exit 0
          fi
          base="${{ github.event.pull_request.base.sha }}"
          echo "Diffing against PR merge base: $base"
          changed="$(git diff --name-only "$base"...HEAD)"
          echo "Changed files vs merge base:"
          echo "$changed"
          if echo "$changed" | grep -qE '^(packaging/linux/|\.github/workflows/[^/]+\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Packaging or workflow files changed - running the full job."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No packaging/linux or workflow changes detected - skipping the packaging build."
          fi

      - name: Setup .NET
        if: steps.detect.outputs.run == 'true'
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # The AOT toolchain. Present on the x64 runner image today, installed
      # explicitly because relying on image contents is what breaks when the image
      # rolls - nightly.yml already installs clang for the same reason.
      - name: Install AOT and packaging toolchain
        if: steps.detect.outputs.run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev imagemagick file binutils

      - name: Build Rust native
        if: steps.detect.outputs.run == 'true'
        run: |
          cd src/NovaTerminal.App/native
          cargo build --release
          mkdir -p target_linux/release
          cp target/release/librusty_pty.so target_linux/release/
          cd rusty_ssh && cargo build --release

      - name: Restore
        if: steps.detect.outputs.run == 'true'
        run: dotnet restore

      # -p:SkipCliShim=true for the same reason as release.yml's Publish AOT: the
      # shim needs a RID-less framework-dependent build, and the AOT binary
      # dispatches the CLI modes itself.
      - name: Publish AOT (linux-x64)
        if: steps.detect.outputs.run == 'true'
        env:
          SKIP_RUST_NATIVE_BUILD: "1"
        run: >-
          dotnet publish src/NovaTerminal.App/NovaTerminal.App.csproj
          -c ${{ env.CONFIGURATION }} -r linux-x64 --self-contained true
          -p:PublishAot=true -p:SkipCliShim=true
          -p:Version=0.0.1-ci -p:InformationalVersion=0.0.1-ci
          -o artifacts/publish/linux-x64

      - name: Build .deb
        if: steps.detect.outputs.run == 'true'
        run: |
          chmod +x packaging/linux/*.sh
          packaging/linux/build-deb.sh artifacts/publish/linux-x64 0.0.1-ci amd64 artifacts/linux

      - name: Test build-deb.sh
        if: steps.detect.outputs.run == 'true'
        run: |
          docker run --rm -v "$PWD:/w:ro" -w /w ubuntu:22.04 bash -c \
            'apt-get update -qq && apt-get install -y -qq file imagemagick binutils >/dev/null &&
             packaging/linux/test-build-deb.sh'

      # vpk pinned to 1.2.0, in lockstep with Directory.Packages.props and the two
      # other install sites in these workflows.
      - name: Install vpk
        if: steps.detect.outputs.run == 'true'
        run: dotnet tool install -g vpk --version 1.2.0

      # --channel linux-x64, NOT the platform default 'linux'. Linux publishes two
      # architectures into one GitHub release, and a Velopack feed is per-channel,
      # not per-architecture, so a shared 'linux' channel would offer an arm64
      # client an x64 package. Must match VelopackUpdateService.ResolveExplicitChannel.
      #
      # 0.0.1-ci because vpk rejects anything below 0.0.1. No --delta concerns here:
      # there is no prior release in this scratch output directory, so a full-only
      # pack is expected and correct for a dry run.
      - name: Pack AppImage (Velopack)
        if: steps.detect.outputs.run == 'true'
        run: |
          rm -f artifacts/publish/linux-x64/*.pdb
          vpk pack \
            --packId NovaTerminalApp \
            --packVersion 0.0.1-ci \
            --packDir artifacts/publish/linux-x64 \
            --mainExe NovaTerminal \
            --packTitle NovaTerminal \
            --packAuthors benyblack \
            --channel linux-x64 \
            --icon src/NovaTerminal.App/Assets/nova_icon.png \
            --exclude '.*\.pdb' \
            -o artifacts/linux

      # Mirrors release.yml's post-pack assertions, so a silent vpk behaviour change
      # surfaces here instead of on a tag. The `~` in the .deb filename is the
      # prerelease mapping from build-deb.sh - asserting it here pins that behaviour.
      - name: Assert expected assets
        if: steps.detect.outputs.run == 'true'
        run: |
          cd artifacts/linux
          ls -la
          test -n "$(ls ./*.AppImage 2>/dev/null)" || { echo "vpk pack produced no .AppImage" >&2; exit 1; }
          test -f novaterminal_0.0.1~ci-1_amd64.deb || { echo "no .deb (or wrong prerelease version mapping)" >&2; exit 1; }
          test -f NovaTerminalApp-0.0.1-ci-linux-x64-full.nupkg || { echo "no linux-x64 full nupkg" >&2; exit 1; }
          test -f releases.linux-x64.json || { echo "no releases.linux-x64.json" >&2; exit 1; }
          dpkg-deb --contents novaterminal_0.0.1~ci-1_amd64.deb

      - name: Smoke test (bare containers)
        if: steps.detect.outputs.run == 'true'
        run: packaging/linux/smoke-test.sh artifacts/linux

      - name: Upload dry-run artifact
        if: always() && steps.detect.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: linux-packaging-dryrun
          retention-days: 5
          path: |
            artifacts/linux/*.AppImage
            artifacts/linux/*.deb
            artifacts/linux/*.nupkg
            artifacts/linux/releases.*.json
