name: CI

on:
  pull_request:
    paths-ignore:
      - "documents/**"
      - "**/*.md"
  push:
    branches: [main]
    paths-ignore:
      - "documents/**"
      - "**/*.md"
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

# No job here writes to the repository: every step is build/test plus
# checkout/setup-dotnet/cache/upload-artifact, none of which touch GITHUB_TOKEN
# beyond reading the source. Grant the minimum and let any future job that needs
# more opt in with its own job-level `permissions:` block.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CONFIGURATION: Release
  # Opt into Node.js 24 now; GitHub Actions will force this on 2026-06-02.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Prevent dotnet/MSBuild daemons from outliving each step and holding the
  # GitHub Actions runner's redirected stdout/stderr pipes open. Without these,
  # Linux Unit Tests has historically hung after tests completed because the
  # MSBuild worker pool spawned by `dotnet test` (and any nested `dotnet build`
  # inside tests like VtReportCliTests) kept the pipe alive past the step
  # timeout. UseSharedCompilation is also disabled globally via
  # Directory.Build.props, but these env vars cover the driver-level daemons
  # (MSBuild build server, MSBuild worker node reuse) that project files
  # cannot influence.
  DOTNET_CLI_USE_MSBUILD_SERVER: '0'
  MSBUILDDISABLENODEREUSE: '1'

jobs:
  # Native FFI unit/integration tests (handle registry, abuse suite, alloc balance).
  # The per-OS build job only `cargo build`s the crates; the cargo test suites
  # (rusty_ssh fail-closed handle tests + rusty_pty cancel tests) run here.
  #
  # Runs on Windows as well as Linux: rusty_pty's ConPTY code is behind #[cfg(windows)], so its
  # tests - including the Win32 handle-leak regression test added for #120 - are compiled out
  # entirely on Linux and were never actually exercised by CI.
  rust-ffi-tests:
    name: Rust FFI Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Rust incremental build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src/NovaTerminal.App/native
            src/NovaTerminal.App/native/rusty_ssh
      - name: rusty_ssh FFI tests (registry, abuse suite, alloc balance)
        run: cargo test --manifest-path src/NovaTerminal.App/native/rusty_ssh/Cargo.toml
      - name: rusty_pty FFI tests
        run: cargo test --manifest-path src/NovaTerminal.App/native/Cargo.toml

  # Single build job per OS: Rust native + .NET in one step.
  # Eliminates the artifact round-trip that the old build_native → build_dotnet split required.
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["windows-latest","ubuntu-latest","macos-latest"]' || '["windows-latest","ubuntu-latest"]') }}

    steps:
      - uses: actions/checkout@v4

      # ── Rust native ────────────────────────────────────────────────────────────
      # Cache the compiled binary keyed on all Rust source files.
      # On a hit the toolchain install, Swatinem, and cargo build are all skipped.
      # Cache both target/release and target_linux/release: the Linux csproj
      # consumes the .so from target_linux/release, so it must be part of the
      # cache or a cache hit leaves the staged path empty and the Build step
      # below is skipped. The v2 bump invalidated older caches that contained only
      # target/release; the v3 bump on the key itself is explained there.
      - name: Cache native binary
        id: native-bin-cache
        uses: actions/cache@v4
        with:
          path: |
            src/NovaTerminal.App/native/target/release
            src/NovaTerminal.App/native/target_linux/release
          # Key version bumped to v3 for the rusty_pty input-hash stamp
          # (native/target/release/.nova-rust-inputs.sha256). A v2 payload predates the stamp,
          # so restoring one would make BuildRustNative call the binary stale and invoke cargo -
          # on a runner where this same cache hit skipped the toolchain install and the cargo
          # registry cache. Worse, actions/cache does not re-save on an exact key hit, so the
          # stamp would never enter the v2 payload and every hit would pay that rebuild forever.
          # Bumping forces one miss, whose save captures the stamp.
          key: native-bin-v3-${{ matrix.os }}-${{ hashFiles('src/NovaTerminal.App/native/src/**', 'src/NovaTerminal.App/native/Cargo.toml', 'src/NovaTerminal.App/native/Cargo.lock') }}

      - name: Install Rust
        if: steps.native-bin-cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Rust incremental build cache
        if: steps.native-bin-cache.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/NovaTerminal.App/native

      - name: Build Rust (Windows)
        if: matrix.os == 'windows-latest' && steps.native-bin-cache.outputs.cache-hit != 'true'
        run: cd src/NovaTerminal.App/native && cargo build --release

      # Linux build also stages the .so into target_linux/release so the
      # cached payload is complete and no separate stage step is needed.
      - name: Build Rust (Linux)
        if: matrix.os == 'ubuntu-latest' && steps.native-bin-cache.outputs.cache-hit != 'true'
        run: |
          cd src/NovaTerminal.App/native
          cargo build --release
          mkdir -p target_linux/release
          cp target/release/librusty_pty.so target_linux/release/

      - name: Build Rust (macOS)
        if: matrix.os == 'macos-latest' && steps.native-bin-cache.outputs.cache-hit != 'true'
        run: cd src/NovaTerminal.App/native && cargo build --release

      # ── .NET ───────────────────────────────────────────────────────────────────
      - name: Cache .NET SDK
        uses: actions/cache@v4
        with:
          path: ~/.dotnet
          key: dotnet-sdk-${{ runner.os }}-${{ hashFiles('global.json') }}
          restore-keys: dotnet-sdk-${{ runner.os }}-

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        env:
          DOTNET_INSTALL_DIR: ~/.dotnet
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c ${{ env.CONFIGURATION }} --no-restore

      # Upload only the test output directories. src/*/bin/ is 100% duplicated inside
      # tests/NovaTerminal.App.Tests/bin/ (MSBuild copies all referenced DLLs + executables),
      # so including it would double the artifact size for no benefit.
      # VtReportCliTests needs src/NovaTerminal.App/bin/ at runtime — the unit test
      # job restores it from the test output via a symlink/junction (see below).
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-build-${{ matrix.os }}
          retention-days: 1
          # upload-artifact@v4 strips the longest common ancestor of all paths, so
          # "tests/" is stripped from both entries here. All download-artifact steps
          # compensate by specifying path: tests to restore the prefix.
          path: |
            tests/NovaTerminal.App.Tests/bin/${{ env.CONFIGURATION }}
            tests/NovaTerminal.Platform.Tests/bin/${{ env.CONFIGURATION }}
            tests/NovaTerminal.Architecture.Tests/bin/${{ env.CONFIGURATION }}
            tests/NovaTerminal.VT.Tests/bin/${{ env.CONFIGURATION }}
            tests/NovaTerminal.Rendering.Tests/bin/${{ env.CONFIGURATION }}
            tests/NovaTerminal.McpServer.Tests/bin/${{ env.CONFIGURATION }}

  build_and_unit_tests:
    name: Unit Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        # Same dispatch-conditional shape as `build` above, and for the same reason: macOS is
        # not worth the minutes on every PR, but it must be reachable WITHOUT cutting a
        # release. Until now `build` compiled on macOS while nothing ever ran the tests there,
        # so macOS's only test coverage was release.yml's release_tests — meaning a
        # macOS-only defect could surface exactly once, at release time, where it blocks the
        # release. That is how #325's port-forward backpressure test went three months
        # unverified on macOS and then failed the first release that ran it.
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["windows-latest","ubuntu-latest","macos-latest"]' || '["windows-latest","ubuntu-latest"]') }}

    steps:
      - uses: actions/checkout@v4

      - name: Cache .NET SDK
        uses: actions/cache@v4
        with:
          path: ~/.dotnet
          key: dotnet-sdk-${{ runner.os }}-${{ hashFiles('global.json') }}
          restore-keys: dotnet-sdk-${{ runner.os }}-

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        env:
          DOTNET_INSTALL_DIR: ~/.dotnet
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dotnet-build-${{ matrix.os }}
          # upload-artifact@v4 strips the longest common ancestor of all uploaded paths.
          # Both uploaded paths share "tests/" so it gets stripped inside the zip.
          # Downloading to "tests" restores the expected tests/* structure.
          path: tests

      # zip artifacts don't preserve Unix execute bits; restore them so the test host and
      # any app/CLI binaries referenced by tests (NovaTerminal.App, NovaTerminal.Cli) can run.
      - name: Restore execute permissions (Linux)
        if: runner.os == 'Linux'
        run: |
          find tests -path "*/bin/Release/net*" -type f \
            ! -name "*.dll" ! -name "*.json" ! -name "*.pdb" ! -name "*.xml" \
            ! -name "*.so" ! -name "*.dylib" ! -name "*.a" ! -name "*.txt" \
            | xargs chmod +x

      # VtReportCliTests.cs looks for app/CLI binaries in src/*/bin/Release/net10.0/.
      # Every file there is already present in the test output (MSBuild copies all
      # referenced DLLs and the host executable), so we mirror it locally with
      # hardlinks (Linux) or robocopy (Windows) instead of duplicating 1.1 GB in
      # the artifact. Local disk copy is fast; network upload/download is not.
      - name: Reconstruct src bin dirs from test output (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p src/NovaTerminal.App/bin/Release src/NovaTerminal.Cli/bin/Release
          cp -rl tests/NovaTerminal.App.Tests/bin/Release/net10.0 src/NovaTerminal.App/bin/Release/net10.0
          cp -rl tests/NovaTerminal.App.Tests/bin/Release/net10.0 src/NovaTerminal.Cli/bin/Release/net10.0

      - name: Reconstruct src bin dirs from test output (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $src = "tests\NovaTerminal.App.Tests\bin\Release\net10.0"
          # robocopy exits 0 (nothing to copy) or 1 (files copied) on success; >=8 is an error
          foreach ($dst in @("src\NovaTerminal.App\bin\Release\net10.0", "src\NovaTerminal.Cli\bin\Release\net10.0")) {
            robocopy $src $dst /E /NJH /NJS /NFL /NDL /NC /NS | Out-Null
            if ($LASTEXITCODE -ge 8) { exit $LASTEXITCODE }
          }
          exit 0

      - name: Restore
        run: dotnet restore

      # The shell-integration tests under tests/NovaTerminal.App.Tests/CommandAssist/ShellIntegration/Integration
      # spawn real bash/zsh/fish via the production PTY path. bash is
      # preinstalled on ubuntu-latest; zsh and fish are not on ubuntu-24.04,
      # so install them here -- otherwise ZshShellIntegrationTests and
      # FishShellIntegrationTests skip instead of running.
      - name: Install zsh and fish (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh fish

      # Gating lane: the non-headless test projects. These are deterministic and
      # MUST pass. The filter drops the lanes that run in their own jobs (replay,
      # render-metrics, pty-smoke, stress, golden-shared-png).
      - name: Test (unit — gating, non-headless projects)
        env:
          SKIP_RUST_NATIVE_BUILD: '1'
        shell: bash
        run: |
          set -e
          filter="Category!=Replay&Category!=RenderMetrics&Category!=PtySmoke&Category!=Stress&Category!=GoldenSharedPng"
          for proj in VT Rendering Architecture Platform McpServer; do
            echo "::group::NovaTerminal.$proj.Tests"
            dotnet test "tests/NovaTerminal.$proj.Tests" -c "$CONFIGURATION" --no-build --no-restore \
              --filter "$filter" --logger "trx;LogFileName=unit_${proj}.trx"
            echo "::endgroup::"
          done

      # NON-BLOCKING lane: the Avalonia-headless suite (NovaTerminal.App.Tests).
      # It intermittently deadlocks on a testhost teardown hang — a dump-confirmed
      # framework deadlock in Avalonia.Headless.XUnit 12.0.4 (the latest release),
      # reported upstream as AvaloniaUI/Avalonia#21467 and tracked here as #81. No
      # in-repo config fixes it (collection serialization, maxParallelThreads:1, and
      # ThreadPool.SetMinThreads were all ruled out with dump evidence). Until an
      # upstream fix lands, run it as continue-on-error so the flake can't block PRs,
      # while still executing it: a clean run reports real pass/fail, a genuine
      # regression shows as a failed (non-blocking) check, and each hang writes a
      # mini dump (uploaded below) for ongoing diagnosis.
      - name: Test (headless App.Tests — NON-BLOCKING, see #81 / AvaloniaUI/Avalonia#21467)
        continue-on-error: true
        env:
          SKIP_RUST_NATIVE_BUILD: '1'
        shell: bash
        run: |
          dotnet test tests/NovaTerminal.App.Tests -c "$CONFIGURATION" --no-build --no-restore \
            --filter "Category!=Replay&Category!=RenderMetrics&Category!=PtySmoke&Category!=Stress&Category!=GoldenSharedPng" \
            --blame-hang-timeout 5m --blame-hang-dump-type mini \
            --logger "trx;LogFileName=unit_app.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-tests-${{ runner.os }}
          retention-days: 5
          # *.dmp captures the blame-hang minidump on a teardown hang (#81).
          path: |
            **/*.trx
            **/*.dmp

  # Native SSH end-to-end against a real sshd in a container.
  #
  # These tests existed before this job did, and never ran anywhere: every one is a
  # [DockerFact], which self-skips unless NOVATERM_ENABLE_DOCKER_E2E=1, and nothing in CI set
  # it. The suite was written, committed, skipped, and counted as coverage — which is why the
  # test matrix still listed auth, host-key and forwarding as "pending manual" while a
  # Dockerized suite sat next to it. This job is what makes the difference between the two
  # visible.
  #
  # Deliberately blocking rather than continue-on-error. A non-blocking lane here would repeat
  # the mistake #127 caught in the Render Metrics job: a check whose name claims coverage it
  # does not enforce. If it turns flaky, the fix is to stabilise the fixture, not to silence
  # the gate.
  #
  # Linux only: the tests drive `docker` through the CLI, and ubuntu-latest is the runner image
  # with a working Linux Docker daemon. The Windows runners would need Linux-container support
  # that is not available there, and nothing under test is platform-specific — the fixture
  # exercises the same rusty_ssh library either way.
  native_ssh_docker_e2e:
    name: Native SSH Docker E2E (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build]

    steps:
      - uses: actions/checkout@v4

      - name: Cache .NET SDK
        uses: actions/cache@v4
        with:
          path: ~/.dotnet
          key: dotnet-sdk-${{ runner.os }}-${{ hashFiles('global.json') }}
          restore-keys: dotnet-sdk-${{ runner.os }}-

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        env:
          DOTNET_INSTALL_DIR: ~/.dotnet
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dotnet-build-ubuntu-latest
          path: tests

      # zip artifacts drop Unix execute bits; the test host needs them back. librusty_ssh.so
      # travels in this artifact too (Platform.Tests copies it as Content), so the P/Invoke
      # surface these tests exercise is already in place — no Rust rebuild needed.
      - name: Restore execute permissions
        run: |
          find tests -path "*/bin/Release/net*" -type f \
            ! -name "*.dll" ! -name "*.json" ! -name "*.pdb" ! -name "*.xml" \
            ! -name "*.so" ! -name "*.dylib" ! -name "*.a" ! -name "*.txt" \
            | xargs chmod +x

      - name: Docker preflight
        run: docker info --format 'server={{.ServerVersion}}'

      - name: Restore
        run: dotnet restore

      # The fixture builds the image itself on first use (DockerSshFixture.EnsureImageBuiltAsync),
      # so there is no separate build step here; a failure to build surfaces as a test failure
      # with the docker output attached.
      - name: Test (native SSH Docker E2E)
        env:
          NOVATERM_ENABLE_DOCKER_E2E: '1'
          SKIP_RUST_NATIVE_BUILD: '1'
        shell: bash
        run: |
          dotnet test tests/NovaTerminal.Platform.Tests -c "$CONFIGURATION" --no-build --no-restore \
            --filter "Category=DockerE2E" \
            --logger "trx;LogFileName=native_ssh_docker_e2e.trx"

      # No "collect container logs" step on purpose: the fixture runs containers with --rm and
      # removes them in DisposeAsync, which still executes when a test fails, so by the time a
      # post-step ran there would be nothing left to read. The diagnostics live where they are
      # actually available instead — DockerSshFixture attaches `docker logs` output to the
      # readiness timeouts it throws, so the failure reaches the .trx with the logs in it.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-ssh-docker-e2e
          retention-days: 5
          path: "**/native_ssh_docker_e2e.trx"

  # Coverage measurement (#117). coverlet.collector was pinned in
  # Directory.Packages.props and referenced by all five test projects, but nothing ever
  # enabled it - no invocation passed a collect switch and no report was produced.
  #
  # Deliberately a separate job rather than instrumenting the gating Unit Tests lane.
  # Coverage instrumentation slows execution by orders of magnitude on hot loops, and the
  # suite contains wall-clock assertions - CsiParamClampTests.HugeCsiParameter_DoesNotHang
  # guards the #124 parser DoS with a 2s ceiling, and measured 2088ms under instrumentation
  # locally. Instrumenting the gate would make the gate's own timing assertions unreliable,
  # so correctness and measurement are kept apart.
  # Formatting was previously checked only by ci/run.{ps1,sh}, and those were deliberately
  # report-only because main carried 674 pre-existing whitespace violations. Nothing in
  # GitHub CI looked at formatting at all, so the count drifted upward unnoticed (649 -> 674
  # over two weeks with nobody working on it). #216 swept the backlog; this job is the half
  # that stops it re-accumulating.
  #
  # Runs on both OSes on purpose. `.editorconfig` requires CRLF while git stores LF, so
  # before `.gitattributes` pinned the checkout this check reached a different verdict per
  # platform. The ubuntu leg is what proves that pinning works.
  #
  # Scoped to `whitespace`: a bare `dotnet format` also runs the style and analyzer passes,
  # whose diagnostics belong to #108. Mixing them would make this gate fail for reasons
  # unrelated to formatting.
  format:
    name: Format (whitespace)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Restore
        run: dotnet restore

      - name: Verify formatting
        run: dotnet format whitespace --verify-no-changes --no-restore

  coverage:
    name: Coverage (NovaTerminal.VT floor)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build]

    steps:
      - uses: actions/checkout@v4

      - name: Cache .NET SDK
        uses: actions/cache@v4
        with:
          path: ~/.dotnet
          key: dotnet-sdk-${{ runner.os }}-${{ hashFiles('global.json') }}
          restore-keys: dotnet-sdk-${{ runner.os }}-

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        env:
          DOTNET_INSTALL_DIR: ~/.dotnet
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/*.csproj"

      # Builds from source rather than consuming the build job's artifact. Two reasons:
      #
      # 1. `dotnet test <dir> --no-build --settings <file>` silently does nothing on this
      #    SDK - it exits 0 in ~0.3s with no output and writes no report, five times over.
      #    The gating lane gets away with the same --no-build because it passes no
      #    --settings. Building here matches the invocation shape that was verified to
      #    produce a report locally, instead of relying on that combination working.
      # 2. Coverage needs the source tree anyway to attribute lines, so the artifact saved
      #    nothing here.
      #
      # The cost is one extra build in exchange for a job that demonstrably measures.
      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c ${{ env.CONFIGURATION }} --no-restore

      # continue-on-error: this job measures, it does not judge correctness - the Unit Tests
      # lane already does that on an uninstrumented run. Without this, a wall-clock
      # assertion tripped by instrumentation overhead (see the job comment) would fail here
      # for a reason that says nothing about the code. Coverage data is still written for
      # every test that ran, so the floor check below remains meaningful.
      - name: Test with coverage
        continue-on-error: true
        env:
          SKIP_RUST_NATIVE_BUILD: '1'
        shell: bash
        run: |
          # No `|| true` inside the loop. The step is already continue-on-error, so
          # swallowing exit codes there only destroys the diagnostics - which is exactly
          # what happened on the first attempt: five empty log groups and no way to tell
          # why. set -x records the resolved command so a failure explains itself.
          set -x
          dotnet --version
          filter="Category!=Replay&Category!=RenderMetrics&Category!=PtySmoke&Category!=Stress&Category!=GoldenSharedPng"
          # Which projects are measured, and why these:
          #
          # Architecture.Tests is deliberately absent. It has no coverlet.collector
          # reference (unlike the four below), so it produced no report and the job
          # measured four projects while listing five. It asserts project and IL structure
          # rather than executing product code, so there is little for coverlet to
          # attribute - excluding it is more honest than adding the package to make an
          # empty report appear.
          #
          # App.Tests is also absent, matching the gating lane, which excludes it because
          # of the Avalonia headless flake (#81). It does carry the collector, and it
          # exercises a lot of VT (the buffer and reflow scenario suites live there) - so
          # its absence is the main reason the VT figure below understates true coverage.
          for proj in VT Rendering Platform McpServer; do
            echo "::group::NovaTerminal.$proj.Tests"
            dotnet test "tests/NovaTerminal.$proj.Tests" -c "$CONFIGURATION" --no-restore \
              --filter "$filter" \
              --settings tests/coverage.runsettings \
              --results-directory "coverage/$proj"
            echo "::endgroup::"
          done
          echo "=== collected reports ==="
          find coverage -name '*.cobertura.xml' -print || echo "none found"

      # A floor, not a target, and deliberately below the measured value: VT is at 53.14%
      # line / 46.51% branch as measured by this invocation, so the floor is 50% - normal
      # churn cannot turn a green PR red, and it should be ratcheted up as coverage grows
      # rather than set aspirationally now. VT gets the only floor because it is the
      # conformance-critical assembly; the other four upload their reports so their numbers
      # are visible before anyone commits to a floor for them.
      - name: Check coverage floor (NovaTerminal.VT)
        shell: pwsh
        run: >-
          ./scripts/check-coverage.ps1
          -ReportDirectory coverage/VT
          -MinimumLinePercent 50
          -Label NovaTerminal.VT

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          retention-days: 5
          path: coverage/**/*.cobertura.xml

  golden_shared_png_tests:
    name: Golden Shared PNGs (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 10
    needs: [build]

    steps:
      - uses: actions/checkout@v4

      - name: Cache .NET SDK
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/.dotnet
          key: dotnet-sdk-${{ runner.os }}-${{ hashFiles('global.json') }}
          restore-keys: dotnet-sdk-${{ runner.os }}-

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        env:
          DOTNET_INSTALL_DIR: ~/.dotnet
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Download build artifact
        id: download_golden_build_artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: dotnet-build-windows-latest
          path: tests

      - name: Reset partial artifact download
        if: steps.download_golden_build_artifact.outcome == 'failure'
        shell: pwsh
        run: |
          Remove-Item tests\NovaTerminal.App.Tests\bin -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item tests\NovaTerminal.Platform.Tests\bin -Recurse -Force -ErrorAction SilentlyContinue

      - name: Download build artifact (retry)
        if: steps.download_golden_build_artifact.outcome == 'failure'
        uses: actions/download-artifact@v4
        with:
          name: dotnet-build-windows-latest
          path: tests

      - name: Restore
        run: dotnet restore

      - name: Run Golden Shared PNG Tests
        run: dotnet test -c ${{ env.CONFIGURATION }} --no-build --no-restore --filter "Category=GoldenSharedPng" --blame-hang-timeout 8m --blame-hang-dump-type none --logger "trx;LogFileName=golden_shared_png_tests.trx"

      - name: Upload golden shared PNG test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-shared-png-tests-windows
          retention-days: 5
          path: "**/*golden_shared_png_tests.trx"

  replay_tests:
    name: Replay Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    if: github.event_name != 'pull_request'
    timeout-minutes: 15
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Cache .NET SDK
        uses: actions/cache@v4
        with:
          path: ~/.dotnet
          key: dotnet-sdk-${{ runner.os }}-${{ hashFiles('global.json') }}
          restore-keys: dotnet-sdk-${{ runner.os }}-

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        env:
          DOTNET_INSTALL_DIR: ~/.dotnet
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dotnet-build-${{ matrix.os }}
          path: tests

      - name: Restore execute permissions (Linux)
        if: runner.os == 'Linux'
        run: |
          find tests -path "*/bin/Release/net*" -type f \
            ! -name "*.dll" ! -name "*.json" ! -name "*.pdb" ! -name "*.xml" \
            ! -name "*.so" ! -name "*.dylib" ! -name "*.a" ! -name "*.txt" \
            | xargs chmod +x

      - name: Restore
        run: dotnet restore

      - name: Run Replay Tests
        env:
          PARITY_ARTIFACT_DIR: ${{ github.workspace }}/artifacts/parity
        run: dotnet test -c ${{ env.CONFIGURATION }} --no-build --no-restore --filter "Category=Replay" --blame-hang-timeout 8m --blame-hang-dump-type none --logger "trx;LogFileName=replay_tests.trx"

      - name: Prepare Replay Artifact Bundle
        if: always()
        shell: pwsh
        run: |
          $bundleDir = "artifacts/parity"
          New-Item -ItemType Directory -Force -Path $bundleDir | Out-Null
          "runner_os=${{ runner.os }}; matrix_os=${{ matrix.os }}; run_id=${{ github.run_id }}" |
            Set-Content -Path (Join-Path $bundleDir "_artifact_meta.txt")

      - name: Upload Replay Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: replay-snapshots-${{ matrix.os }}
          retention-days: 5
          path: |
            artifacts/parity/*.snap
            artifacts/parity/**/*.snap
            artifacts/parity/_artifact_meta.txt
            **/*replay_tests.trx

